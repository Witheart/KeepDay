# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# 并行构建多个 module，缩短构建时间
org.gradle.parallel=true
# 复用构建产物（build cache），二次构建更快
org.gradle.caching=true
# 常驻守护进程，避免每次同步都重启 JVM
org.gradle.daemon=true
# 网络不稳定时减少因单次超时导致的整体重试
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
# Gradle 内置的 Kotlin DSL 会把 gradle-<版本>-src.zip 从 services.gradle.org 拉下来
# （地址在 Gradle 内部硬编码，仓库配置改不了），直连会卡死/失败，这里让 Gradle 走本机 Clash 代理
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
# 国内镜像走直连，不绕代理
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.aliyun.com|*.google.com|*.maven.apache.org
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.aliyun.com|*.google.com|*.maven.apache.org
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
kotlin.incremental=true